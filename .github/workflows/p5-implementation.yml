name: P5 Portfolio Insights Checks
on:
  push:
    branches: ['feat/p5-insights-review']
  pull_request:
    paths: ['db/**','src/**','tests/**','.github/workflows/p5-implementation.yml']
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  postgres:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Qualify isolated P0–P5 data and owner-permission regressions
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres createdb control_p5_test
          cat tests/sql/bootstrap.sql db/schema.sql db/p1-app.sql db/p2-progress.sql db/p3-github.sql db/p4-recommendations.sql db/p5-reviews.sql tests/sql/qualify.sql tests/sql/qualify-candidates.sql tests/sql/p2-qualify.sql tests/sql/p3-qualify.sql tests/sql/p4-qualify.sql tests/sql/p5-qualify.sql | sudo -u postgres psql -d control_p5_test -v ON_ERROR_STOP=1
      - run: echo "P5 fixture is isolated; not a real Supabase Auth deployment."
