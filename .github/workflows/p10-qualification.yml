name: P10 Evidence-Gated Release Operations Qualification
on:
  push:
    branches: ['feat/p10-evidence-gated-release-closure']
  pull_request:
    paths: ['src/**','tests/**','scripts/**','db/**','docs/18-p10-acceptance.md','.github/workflows/p10-qualification.yml','playwright*.mjs']
permissions:
  contents: read
env:
  CONTROL_P10_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  CONTROL_P9_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  NEXT_TELEMETRY_DISABLED: '1'
  CONTROL_P10_BUILD_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  local-postgres:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Owner RLS, concurrency and actual runner-local synthetic backup/restore
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres createdb control_p6_test
          cat tests/sql/bootstrap.sql db/schema.sql db/p1-app.sql db/p2-progress.sql db/p3-github.sql db/p4-recommendations.sql db/p5-reviews.sql db/p7-device-receipts.sql tests/sql/qualify.sql tests/sql/qualify-candidates.sql tests/sql/p2-qualify.sql tests/sql/p3-qualify.sql tests/sql/p4-qualify.sql tests/sql/p5-qualify.sql tests/sql/p7-qualify.sql | sudo -u postgres psql -d control_p6_test -v ON_ERROR_STOP=1
          node scripts/p6-concurrency.mjs
          sudo -u postgres bash scripts/p9-local-restore.sh
  browser-fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: True Chromium desktop/mobile with synthetic fixtures ONLY
        run: npx playwright test --config=playwright.config.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-synthetic-chromium-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
  source-and-handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Create and verify exact unmodified source BEFORE build
        run: |
          set -euo pipefail
          node scripts/p9-source-rehearsal.mjs create
          (cd release-evidence/p9 && sha256sum --check SHA256SUMS)
          node scripts/p9-source-rehearsal.mjs verify
      - name: Produce unsigned always-denied review handoff
        run: |
          set -euo pipefail
          node scripts/p10-acceptance-handoff.mjs
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('release-evidence/p10/acceptance-handoff.json'));if(d.operator_decision!=='DENY'||d.missing_gates.length!==12||d.release_authorized!==false)process.exit(1);"
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: p10-unsigned-source-and-denial-handoff
          path: |
            release-evidence/p9/
            release-evidence/p10/acceptance-handoff.json
          retention-days: 7
  binary-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: First clean locked-install build
        run: |
          npm ci
          npm run build
          node scripts/p10-binary-replay.mjs capture
      - name: Independent second locked install and source-matched build
        run: |
          set -euo pipefail
          rm -rf .next
          npm ci
          npm run build
          node scripts/p10-binary-replay.mjs compare
      - name: Ensure no release approvals written to comparison
        run: |
          node --input-type=module -e "import fs from 'node:fs';let d=JSON.parse(fs.readFileSync('release-evidence/p10/binary-comparison.json'));if(d.matched!==true||d.release_authorized!==false||d.deployed!==false||d.source_sha!==process.env.CONTROL_P10_EXPECTED_HEAD)process.exit(1);"
      - uses: actions/upload-artifact@v4
        with:
          name: p10-double-build-executable-reproducibility
          path: |
            release-evidence/p10/binary-first.json
            release-evidence/p10/binary-comparison.json
          retention-days: 7
          if-no-files-found: error
