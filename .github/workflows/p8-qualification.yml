name: P8 Human Acceptance and Controlled Release Checks
on:
  push:
    branches: ['feat/p8-controlled-release-decision']
  pull_request:
    paths: ['src/**','db/**','tests/**','scripts/p8-*','docs/16-p8-acceptance.md','playwright*.mjs','.github/workflows/p8-qualification.yml']
permissions:
  contents: read
env:
  CONTROL_P8_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Runner-local RLS and real parallel competing review writes
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres createdb control_p6_test
          cat tests/sql/bootstrap.sql db/schema.sql db/p1-app.sql db/p2-progress.sql db/p3-github.sql db/p4-recommendations.sql db/p5-reviews.sql db/p7-device-receipts.sql tests/sql/qualify.sql tests/sql/qualify-candidates.sql tests/sql/p2-qualify.sql tests/sql/p3-qualify.sql tests/sql/p4-qualify.sql tests/sql/p5-qualify.sql tests/sql/p7-qualify.sql | sudo -u postgres psql -d control_p6_test -v ON_ERROR_STOP=1
          node scripts/p6-concurrency.mjs
  browser-fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Real Chromium, synthetic Review/Release UI, responsive and keyboard
        run: npx playwright test --config=playwright.config.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-synthetic-browser-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: warn
  release-rehearsal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/p8-rehearsal.mjs create
      - name: Independent digest and exact-head rehearsal verification
        run: |
          set -euo pipefail
          (cd release-evidence/p8 && sha256sum --check SHA256SUMS)
          node scripts/p8-rehearsal.mjs verify
      - uses: actions/upload-artifact@v4
        with:
          name: p8-unsigned-review-only-release-rehearsal
          path: release-evidence/p8/
          retention-days: 7
