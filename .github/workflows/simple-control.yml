name: Simple Control CI
on:
  push:
    branches: [main, feat/control-cloudflare-simple-mvp]
  pull_request:
    paths: ['src/**','public/**','tests/**','migrations/**','wrangler.json','package.json','.github/workflows/simple-control.yml']
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build:check
