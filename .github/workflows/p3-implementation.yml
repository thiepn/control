name: P3 GitHub Evidence Checks
on:
  push:
    branches: ['feat/p3-github-evidence']
  pull_request:
    paths: ['db/**','src/**','tests/**','.github/workflows/p3-implementation.yml']
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  postgres:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify P0/P1/P2/P3 SQL against disposable PostgreSQL
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres createdb control_p3_test
          cat tests/sql/bootstrap.sql db/schema.sql db/p1-app.sql db/p2-progress.sql db/p3-github.sql tests/sql/qualify.sql tests/sql/qualify-candidates.sql tests/sql/p2-qualify.sql tests/sql/p3-qualify.sql | sudo -u postgres psql -d control_p3_test -v ON_ERROR_STOP=1
      - run: echo "GitHub webhook test fixtures are local, and real Supabase/Auth/App registration gates remain separate."
