name: P2 Implementation Checks
on:
  push:
    branches: ['feat/p2-milestones-focus']
  pull_request:
    paths: ['db/**','src/**','tests/**','.github/workflows/p2-implementation.yml']
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  postgres:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Qualify isolated PostgreSQL P1 and P2 schemas
        run: |
          set -euo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres createdb control_p2_test
          cat tests/sql/bootstrap.sql db/schema.sql db/p1-app.sql db/p2-progress.sql tests/sql/qualify.sql tests/sql/qualify-candidates.sql tests/sql/p2-qualify.sql | sudo -u postgres psql -d control_p2_test -v ON_ERROR_STOP=1
      - run: echo "Local PostgreSQL fixture only. Real Supabase Auth acceptance remains separate."
